[project]
name = "bees-order-agent"
version = "0.1.0"
description = "PT/EN shorthand beverage orders -> stock-checked cart (LangGraph + OpenRouter + Gradio). Unofficial demo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2",
    "openai>=3.31",
    "pydantic>=2.11",
    "rapidfuzz>=3.14",
    "gradio[mcp,oauth]>=6.30,<7",  # the extras HF Spaces installs; keeps the lock in step
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "spaces",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bees_order"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
